name: Build Toko APK

on:
  push:
    paths:
      - "apps/toko-app/**"
      - ".github/workflows/build-toko-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: apps/toko-app
        run: npm install

      - name: Add Android platform
        working-directory: apps/toko-app
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: apps/toko-app
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        working-directory: apps/toko-app/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: apps/toko-app/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: toko-app-debug-apk
          path: apps/toko-app/android/app/build/outputs/apk/debug/app-debug.apk
