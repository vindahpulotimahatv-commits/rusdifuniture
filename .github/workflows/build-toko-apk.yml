name: Build Toko APK

on:
  push:
    paths:
      - "apps/toko-app/**"
      - ".github/workflows/build-toko-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/toko-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icon from logo
        run: npx @capacitor/assets generate --android --iconBackgroundColor "#0B0B0B" --iconBackgroundColorDark "#0B0B0B" --assetPath assets

      - name: Install custom splash screens (portrait & landscape)
        run: |
          mkdir -p android/app/src/main/res/drawable-port-xxhdpi
          mkdir -p android/app/src/main/res/drawable-land-xxhdpi
          cp assets/splash-port.png android/app/src/main/res/drawable-port-xxhdpi/splash.png
          cp assets/splash-land.png android/app/src/main/res/drawable-land-xxhdpi/splash.png

      - name: Sync Capacitor
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: toko-app-debug-apk
          path: apps/toko-app/android/app/build/outputs/apk/debug/app-debug.apk
